<!doctype html>
<html lang="zh-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>洸限｜P2 沙畫頁 Standalone</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@300;400;600&family=Noto+Sans+TC:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./css/style.css?v=2">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
</head>
<body>
  <main class="p2-page" id="audiovisualSection">
    <canvas id="CanvasAnime" aria-hidden="true"></canvas>

    <button class="skip-anim-btn show" id="p2SkipBtn" type="button">
      Skip 略過動畫 ✕
    </button>

    <div id="text-container">
      <div class="ui-line-mask">
        <div class="ui-line-content story-line ui-animate-text">
          <span class="sub-part ui-animate-text">也許，是那位一直遞上肩膀，</span>
          <span class="sub-part ui-animate-text">比你還相信你自己的――摯友！</span>
        </div>
      </div>

      <div class="ui-line-mask">
        <div class="ui-line-content story-line ui-animate-text">
          <span class="sub-part ui-animate-text">或是，無論你飛多高，</span>
          <span class="sub-part ui-animate-text">只在乎你累不累的――家人！</span>
        </div>
      </div>

      <div class="ui-line-mask">
        <div class="ui-line-content story-line ui-animate-text">
          <span class="sub-part ui-animate-text">也可能是，怕你吃不飽、</span>
          <span class="sub-part ui-animate-text">過不好的――長輩嘮叨！</span>
        </div>
      </div>

      <div class="ui-line-mask">
        <div class="ui-line-content story-line ui-animate-text">
          <span class="sub-part ui-animate-text">還有那，無論多晚，總在門口等待、</span>
          <span class="sub-part ui-animate-text">把你當作全世界的毛孩！</span>
        </div>
      </div>

      <div class="ui-line-mask">
        <div class="ui-line-content story-line ui-animate-text" id="goldenLine">
          <span class="ui-animate-text" id="fPart1">回憶，雖然會慢慢消逝</span>
          <span class="dot-char ui-animate-text" id="dot1">..</span>
          <span class="dot-char ui-animate-text" id="dot2">..</span>
          <span class="dot-char ui-animate-text" id="dot3">..</span>
          <span class="ui-animate-text" id="fPart2">卻也會沉澱在心靈中某個深處</span>
        </div>
      </div>
    </div>

    <button class="scroll-arrow-btn" id="p2ReplayBtn" type="button" aria-label="重新播放 P2">
      <svg class="arrow-icon" viewBox="0 0 24 24" aria-hidden="true">
        <polyline points="6 9 12 15 18 9"></polyline>
      </svg>
    </button>
  </main>

  <script src="./js/main.js?v=2"></script>
</body>
</html>

<!doctype html>
<html lang="zh-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>洸限｜P2 沙畫頁 Standalone</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@300;400;600&family=Noto+Sans+TC:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./css/style.css?v=4">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
</head>
<body>
  <main class="p2-page" id="audiovisualSection">
    <canvas id="CanvasAnime" aria-hidden="true"></canvas>
    <canvas id="CanvasDustFront" aria-hidden="true"></canvas>

    <div id="text-container">
      <div class="ui-line-mask">
        <div class="ui-line-content story-line ui-animate-text">
          <span class="sub-part ui-animate-text">總毫不猶豫遞上肩膀，比你還相信自己的摯友――</span>
          <span class="sub-part ui-animate-text">現在，你過得好嗎？</span>
        </div>
      </div>

      <div class="ui-line-mask">
        <div class="ui-line-content story-line ui-animate-text">
          <span class="sub-part ui-animate-text">小時候最喜歡玩爸爸手上的老繭――</span>
          <span class="sub-part ui-animate-text">總覺得，那是英雄才會有的標記。</span>
        </div>
      </div>

      <div class="ui-line-mask">
        <div class="ui-line-content story-line ui-animate-text">
          <span class="sub-part ui-animate-text">餘光裡，總戴得斜斜的老花眼鏡――</span>
          <span class="sub-part ui-animate-text">還有那雙摸得出歲月刻痕的手。</span>
        </div>
      </div>

      <div class="ui-line-mask">
        <div class="ui-line-content story-line ui-animate-text">
          <span class="sub-part ui-animate-text">每天下班開門時，那個能</span>
          <span class="sub-part ui-animate-text">直接把我撲倒在地的――甜蜜重量</span>
        </div>
      </div>

      <div class="ui-line-mask">
        <div class="ui-line-content story-line ui-animate-text" id="goldenLine">
          <span class="ui-animate-text" id="fPart1">如果思念有形狀――</span>
          <span class="dot-char ui-animate-text" id="dot1">..</span>
          <span class="dot-char ui-animate-text" id="dot2">..</span>
          <span class="dot-char ui-animate-text" id="dot3">..</span>
          <span class="ui-animate-text" id="fPart2">你希望再次看見、聽見或感受到什麼？</span>
        </div>
      </div>
    </div>
  </main>

  <script src="./js/main.js?v=4"></script>
</body>
</html>
